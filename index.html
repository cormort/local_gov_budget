<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Excel 收件與貼表</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="budget-style.css">
    <script src="home.js"></script>
</head>
<body>

<nav class="app-header md:sticky top-0 z-50">
    <div class="app-header-inner">
        <div>
            <h1 class="app-title">Excel 收件與貼表</h1>
            <p class="app-sub">寄出空白 Excel，收回後一次拖進來，貼成一張彙總表</p>
        </div>
        <div class="app-actions">
            <a href="manage.html" class="btn" title="上傳新的空白 Excel、改名、刪除（需要 GitHub 權杖）">管理範本</a>
            <a href="advanced.html" class="btn" title="網頁查填、調查專案、JSON 彙整">進階功能</a>
        </div>
    </div>
</nav>

<main class="max-w-4xl mx-auto p-4">
    <ol class="grid gap-3 md:grid-cols-3 mb-6">
        <li class="section-card !mb-0"><p class="text-xs font-bold text-slate-500 mb-1">步驟 1</p><p class="font-bold text-slate-800">下載空白 Excel，寄給各機關</p></li>
        <li class="section-card !mb-0"><p class="text-xs font-bold text-slate-500 mb-1">步驟 2</p><p class="font-bold text-slate-800">各機關照原本方式填好寄回</p><p class="text-sm text-slate-500 mt-1">檔名請以機關名稱開頭，貼表時依檔名認機關、照標準機關順序排列</p></li>
        <li class="section-card !mb-0"><p class="text-xs font-bold text-slate-500 mb-1">步驟 3</p><p class="font-bold text-slate-800">按「貼表」，把寄回的檔案一次拖入</p><p class="text-sm text-slate-500 mt-1">一列接一列貼好、重算合計，下載彙總表</p></li>
    </ol>

    <h2 class="text-lg font-bold text-slate-800 mb-3">範本</h2>
    <ul id="home-list" class="section-card divide-y">
        <li class="py-2 text-slate-500">載入中…</li>
    </ul>

    <p class="text-sm text-slate-500 mt-6">要新增範本：到<a href="manage.html" class="btn-link">管理範本</a>上傳空白 Excel。需要網頁填表、應繳名單追蹤或 JSON 彙整：<a href="advanced.html" class="btn-link">進階功能</a>。</p>
</main>

</body>
</html>
