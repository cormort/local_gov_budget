<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdnjs.cloudflare.com;">
    <title>自訂表單查填（由 Excel 產生）</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="budget-style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="form-builder.js"></script>
</head>
<body>

<nav class="bg-white border-b sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a href="index.html" class="text-slate-400 text-xl" title="返回主頁">←</a>
            <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl">🧩</div>
            <div>
                <h1 class="font-bold text-lg text-slate-800 leading-tight">自訂表單查填</h1>
                <p class="text-xs text-slate-500">上傳 Excel 範本 → 自動產生表頭與表單</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="fb-btn-xlsx" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-green-700">📊 上傳 Excel 範本</button>
            <input type="file" id="fb-xlsx-file" class="hidden" accept=".xlsx,.xls">
            <button id="fb-btn-template" class="bg-teal-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow" title="匯出為固定表單範本，放到 forms/ 資料夾供他人以網址開啟">📌 匯出範本</button>
            <button id="fb-btn-import" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold border hover:bg-slate-200">📂 匯入 JSON</button>
            <input type="file" id="fb-json-file" class="hidden" accept=".json">
            <button id="fb-btn-export" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-blue-700">💾 匯出 JSON</button>
            <a id="fb-link-aggregate" href="form-aggregate.html" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold border hover:bg-slate-200" title="匯入各機關回傳的 JSON 彙整">📊 彙整</a>
        </div>
    </div>
</nav>

<div class="max-w-[98%] mx-auto p-4">
    <div class="excel-guide">
        <b>範本規則：</b>第一個非空白列為表頭，第一欄為項目名稱。第二列起的資料會帶入為預設項目；
        儲存格若是公式（如 <code>=B2-C2</code>、<code>=SUM(B2:D2)</code>，限同一列的加減乘除），該欄即成為自動計算欄。空白欄預設為數值欄；要文字欄請在任一資料列填入文字。
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        <div><label class="text-xs font-bold text-slate-400 uppercase">表單名稱</label><input type="text" id="fb-title" class="border-b-2 w-full p-2 outline-none font-bold focus:border-blue-500" readonly></div>
        <div><label class="text-xs font-bold text-slate-400 uppercase">機關名稱</label><input type="text" id="fb-org" class="border-b-2 w-full p-2 outline-none"></div>
        <div><label class="text-xs font-bold text-slate-400 uppercase">年度</label><input type="number" id="fb-year" class="border-b-2 w-full p-2 outline-none" value="115"></div>
        <div><label class="text-xs font-bold text-slate-400 uppercase">填表人</label><input type="text" id="fb-user" class="border-b-2 w-full p-2 outline-none"></div>
    </div>

    <div id="fb-msg" class="text-sm text-slate-500 mb-4">尚未載入範本。</div>

    <div id="fb-card" class="section-card hidden">
        <div class="flex justify-between items-center mb-4">
            <h2 id="fb-heading" class="text-xl font-bold text-slate-800"></h2>
            <button id="fb-btn-add" class="text-blue-600 font-bold text-sm">+ 新增</button>
        </div>
        <div class="overflow-x-auto">
            <table class="budget-table w-full">
                <thead id="fb-thead"></thead>
                <tbody id="fb-tbody"></tbody>
                <tfoot id="fb-tfoot" class="total-row"></tfoot>
            </table>
        </div>
    </div>
</div>

</body>
</html>
