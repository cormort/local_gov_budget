<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdnjs.cloudflare.com;">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Excel 貼表</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="budget-style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="form-builder.js"></script>
    <script src="paste.js"></script>
</head>
<body>

<nav class="app-header md:sticky top-0 z-50">
    <div class="app-header-inner">
        <div class="flex items-center gap-2">
            <a href="./" class="app-back" title="回首頁" aria-label="回首頁">←</a>
            <div>
                <h1 class="app-title">Excel 貼表</h1>
                <p class="app-sub">範本：<span id="ps-form"></span></p>
            </div>
        </div>
        <div class="app-actions">
            <button id="ps-btn-xlsx" class="btn btn-primary" disabled>下載彙總表</button>
            <button id="ps-btn-clear" class="btn btn-danger">清空</button>
        </div>
    </div>
</nav>

<div class="max-w-[98%] mx-auto p-4">
    <div id="ps-drop" class="drop-zone rounded-md px-6 py-8 cursor-pointer mb-4">
        <p class="font-bold text-slate-800 mb-1">把各機關寄回的 Excel 一次拖到這裡，或點此選擇（可多選）</p>
        <p class="text-slate-500 text-sm">依標準機關順序（從檔名辨識）把各檔的列一列接一列貼到空白範本下方，保留原格式，並重算合計、主管、基金列的案數與勾選數；同一機關重複拖入以後者為準</p>
        <input type="file" id="ps-file" class="hidden" accept=".xlsx" multiple>
    </div>

    <div id="ps-msg" class="text-sm text-slate-500 mb-4">載入範本中…</div>

    <div id="ps-result" class="hidden section-card">
        <h2 class="text-lg font-bold text-slate-800 mb-3">貼表順序</h2>
        <div class="overflow-x-auto"><table class="budget-table w-full">
            <thead><tr><th>順序</th><th>機關</th><th>檔名</th><th>貼上列數</th></tr></thead>
            <tbody id="ps-list"></tbody>
        </table></div>
    </div>
</div>

</body>
</html>
