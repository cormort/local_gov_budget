<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdnjs.cloudflare.com;">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>自訂表單彙整</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="budget-style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="form-builder.js"></script>
    <script src="form-aggregate.js"></script>
</head>
<body>

<nav class="bg-white border-b sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a href="./" class="text-slate-400 text-xl" title="回自訂表單">←</a>
            <div class="bg-green-600 text-white p-2 rounded-lg font-bold text-xl">📊</div>
            <div>
                <h1 class="font-bold text-lg text-slate-800 leading-tight">自訂表單彙整</h1>
                <p class="text-xs text-slate-500">匯入各機關回傳的 JSON 或 Excel → 依項目彙總 → 匯出 Excel</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="ag-btn-xlsx" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-green-700">📥 匯出 Excel</button>
            <button id="ag-btn-clear" class="text-red-500 px-3 py-2 border rounded-lg text-sm hover:bg-red-50">🗑️ 清空</button>
        </div>
    </div>
</nav>

<div class="max-w-[98%] mx-auto p-4">
    <div id="ag-drop" class="drop-zone rounded-xl p-12 text-center cursor-pointer mb-6">
        <p class="text-white font-bold text-lg">把各機關回傳的 JSON 或已填好的 Excel 拖到這裡，或點此選擇（可多選；Excel 沒有填報資訊時以檔名當機關名稱）</p>
        <p class="text-slate-400 text-sm">只接受同一份表單（工作表與欄名相同）的檔案；多工作表的表單可先拖入「匯出範本」的 .json；同機關同年度重複上傳會以後者取代</p>
        <input type="file" id="ag-file" class="hidden" accept=".json,.xlsx,.xls" multiple>
    </div>

    <div id="ag-msg" class="text-sm text-slate-500 mb-4">尚未匯入檔案。</div>

    <div id="ag-result" class="hidden">
        <div class="section-card">
            <h2 id="ag-subs-title" class="text-xl font-bold text-slate-800 mb-4">繳交清單</h2>
            <div class="overflow-x-auto"><table class="budget-table w-full"><thead id="ag-subs-head"></thead><tbody id="ag-subs"></tbody></table></div>
        </div>
        <div id="ag-tabs" class="flex flex-wrap gap-1"></div>
        <div class="section-card">
            <label class="text-sm text-slate-600"><input type="checkbox" id="ag-dup-mode"> 每個項目只應由一份檔案填報（檢查重複填報）</label>
            <span id="ag-dup-auto" class="text-xs text-slate-400"></span>
            <div id="ag-dup-card" class="hidden mt-4">
                <h2 id="ag-dup-title" class="text-xl font-bold text-amber-700 mb-1"></h2>
                <p class="text-sm text-slate-500 mb-3">同一項目有多份檔案填了數字。勾選要採計的列；不採計的列不進彙總、明細與匯出。</p>
                <div class="overflow-x-auto"><table class="budget-table w-full"><thead id="ag-dup-head"></thead><tbody id="ag-dup"></tbody></table></div>
            </div>
        </div>
        <div class="section-card">
            <h2 class="text-xl font-bold text-slate-800 mb-4">依項目彙總</h2>
            <div class="overflow-x-auto"><table class="budget-table w-full"><thead id="ag-sum-head"></thead><tbody id="ag-sum"></tbody></table></div>
        </div>
        <div class="section-card">
            <h2 id="ag-detail-title" class="text-xl font-bold text-slate-800 mb-4">明細</h2>
            <div class="overflow-x-auto"><table class="budget-table w-full"><thead id="ag-detail-head"></thead><tbody id="ag-detail"></tbody></table></div>
        </div>
    </div>
</div>

</body>
</html>
