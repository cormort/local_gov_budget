<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdnjs.cloudflare.com;">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>自訂表單彙整</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="budget-style.css?v=20261028g">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="form-builder.js?v=20261028g" defer></script>
    <script src="form-aggregate.js?v=20261028g" defer></script>
</head>
<body>

<nav class="app-header md:sticky top-0 z-50">
    <div class="app-header-inner">
        <div class="flex items-center gap-2">
            <a href="advanced.html" class="app-back" title="回進階功能" aria-label="回進階功能">←</a>
            <div>
                <h1 class="app-title">自訂表單彙整</h1>
                <p class="app-sub">匯入各機關回傳的 JSON 或 Excel，依項目彙總後匯出 Excel</p>
            </div>
        </div>
        <div class="app-actions">
            <button id="ag-btn-xlsx" class="btn btn-primary">匯出 Excel</button>
            <button id="ag-btn-clear" class="btn btn-danger">清空</button>
        </div>
    </div>
</nav>

<div class="max-w-[98%] mx-auto p-4">
    <div id="ag-drop" class="drop-zone rounded-md px-6 py-8 cursor-pointer mb-4"">
        <p class="font-bold text-slate-800 mb-1">把各機關回傳的 JSON 或已填好的 Excel 拖到這裡，或點此選擇（可多選；Excel 沒有填報資訊時以檔名當機關名稱）</p>
        <p class="text-slate-500 text-sm">只接受同一份表單（工作表與欄名相同）的檔案；多工作表的表單可先拖入「匯出範本」的 .json；同機關同年度重複上傳會以後者取代</p>
        <input type="file" id="ag-file" class="hidden" accept=".json,.xlsx,.xls" multiple>
    </div>

    <div id="ag-msg" class="text-sm text-slate-500 mb-4">尚未匯入檔案。</div>

    <div id="ag-result" class="hidden">
        <div class="section-card">
            <h2 id="ag-subs-title" class="text-lg font-bold text-slate-800 mb-3">繳交清單</h2>
            <div class="overflow-x-auto"><table class="budget-table w-full"><thead id="ag-subs-head"></thead><tbody id="ag-subs"></tbody></table></div>
        </div>
        <div id="ag-tabs" class="flex flex-wrap gap-1"></div>
        <div class="section-card">
            <label class="text-sm text-slate-600"><input type="checkbox" id="ag-dup-mode"> 每個項目只應由一份檔案填報（檢查重複填報）</label>
            <span id="ag-dup-auto" class="text-xs text-slate-400"></span>
            <div id="ag-dup-card" class="hidden mt-4">
                <h2 id="ag-dup-title" class="text-lg font-bold text-amber-700 mb-1"></h2>
                <p class="text-sm text-slate-500 mb-3">同一項目有多份檔案填了數字。勾選要採計的列；不採計的列不進彙總、明細與匯出。</p>
                <div class="overflow-x-auto"><table class="budget-table w-full"><thead id="ag-dup-head"></thead><tbody id="ag-dup"></tbody></table></div>
            </div>
        </div>
        <div class="section-card">
            <h2 class="text-lg font-bold text-slate-800 mb-3">依項目彙總</h2>
            <div class="overflow-x-auto"><table class="budget-table w-full"><thead id="ag-sum-head"></thead><tbody id="ag-sum"></tbody></table></div>
        </div>
        <div class="section-card">
            <h2 id="ag-detail-title" class="text-lg font-bold text-slate-800 mb-3">明細</h2>
            <div class="overflow-x-auto"><table class="budget-table w-full"><thead id="ag-detail-head"></thead><tbody id="ag-detail"></tbody></table></div>
        </div>
    </div>
</div>

</body>
</html>
